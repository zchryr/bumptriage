# Privileged half of the Dependabot review.
#
# workflow_run runs this from the default branch with the base repository's full
# secrets, so everything it trusts must be pinned to something the triggering
# pull request cannot choose — see the job condition and the pull request number
# step below.
#
# This is a separate file from the Renovate review on purpose: one file per bot
# is what makes it possible to grant each bot its own IAM role with its own blast
# radius.
#
# This file must exist on the default branch for the trigger to fire at all.
#
# Install as: .github/workflows/bumptriage-dependabot-review.yml

name: bumptriage dependabot review

on:
  workflow_run:
    workflows: ["bumptriage dependabot validate"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  id-token: write
  # Reading artifacts belonging to a different workflow run needs this.
  actions: read

jobs:
  review:
    # head_repository is set by the forge, not by the pull request author, so a
    # fork cannot satisfy it. Without this check a stranger who opens a fork pull
    # request from a `dependabot/` branch reaches this job and its credentials.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    # Strongly recommended: put the model credential in a GitHub Environment with
    # a required reviewer, so no run can spend money unattended. Uncomment after
    # creating the environment — naming one that does not exist creates it
    # silently with no protection at all. See SECURITY.md.
    # environment: model-access
    steps:
      # Checkout runs first because it cleans the workspace: downloading the
      # transcripts before this point would delete them.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download validation transcripts
        uses: actions/download-artifact@v8
        with:
          name: bumptriage-validation
          path: bumptriage-validation
          # Downloading from a different workflow run needs run-id plus a token.
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The number comes from the workflow_run event, which the forge populates.
      # Taking it from the artifact instead would let whoever produced that
      # artifact name any pull request they liked — including a genuine bot one,
      # which passes the action's authorization gate while the evidence bundle
      # stays under their control. The artifact's copy is compared against the
      # event's only as a tamper signal.
      - name: Resolve pull request number
        id: pr
        env:
          EVENT_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          case "$EVENT_NUMBER" in
            ''|*[!0-9]*)
              echo "Refusing to continue: the workflow_run event carried no pull request number." >&2
              exit 1 ;;
          esac
          artifact_number="$(jq -r '.number' bumptriage-validation/pull-request.json)"
          if [ "$artifact_number" != "$EVENT_NUMBER" ]; then
            echo "Refusing to continue: artifact reports PR $artifact_number, event reports $EVENT_NUMBER." >&2
            exit 1
          fi
          echo "number=$EVENT_NUMBER" >> "$GITHUB_OUTPUT"

      # The pull request head is fetched as inert data for the agent to read with
      # Read, Glob, and Grep. Nothing in this job builds, installs, or runs it —
      # that already happened in the unprivileged job.
      - name: Fetch pull request commits
        run: git fetch origin "pull/${{ steps.pr.outputs.number }}/head:bumptriage-head"

      # WARNING: iam/bedrock-oidc-role.yaml cannot currently be assumed — it
      # conditions on `workflow_ref`, which is not an AWS IAM condition key. Use
      # static access keys until it is rewritten; see docs/OIDC.md.
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.BUMPTRIAGE_DEPENDABOT_ROLE_ARN }}
          aws-region: ${{ vars.BUMPTRIAGE_AWS_REGION }}
          role-session-name: bumptriage-dependabot

      - uses: zchryr/bumptriage@v1
        with:
          provider: bedrock
          model: ${{ vars.BUMPTRIAGE_MODEL }}
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          pr-number: ${{ steps.pr.outputs.number }}
          bots: dependabot
          trusted-authors: dependabot[bot]
          # Pins trust to GitHub's Dependabot app rather than to a name.
          trusted-author-ids: "49699333"
          validation-results: bumptriage-validation/validations.json
