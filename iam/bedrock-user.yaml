AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  IAM user with static access keys for invoking Amazon Bedrock from bumptriage.
  Provided for environments that cannot use OIDC. Prefer bedrock-oidc-role.yaml:
  it issues short-lived credentials and stores nothing in your repository.

Parameters:
  UserName:
    Type: String
    Default: bumptriage-review

  BedrockModelArns:
    Type: CommaDelimitedList
    Description: >-
      Inference-profile AND foundation-model ARNs this user may invoke. Prefer
      explicit ARNs over the "*" default — but narrowing this correctly needs
      BOTH kinds of ARN. Invoking a cross-region inference profile is authorised
      against the inference-profile ARN and against the underlying
      foundation-model ARN in every region the profile can route to; listing
      only the profile produces an AccessDenied that reads as though the model
      does not exist. The "*" default hides this, so a deployment that has only
      ever run with the default has not exercised its own least-privilege path.
    Default: "*"

Resources:
  ReviewUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !Ref UserName
      Policies:
        - PolicyName: InvokeBedrock
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: !Ref BedrockModelArns

              # See bedrock-api-key-user.yaml for why these two are here, and
              # for what about them is documented rather than observed. Note
              # this template's static access keys authenticate with SigV4, so
              # unlike an API key it needs no bedrock:CallWithBearerToken.
              - Effect: Allow
                Action:
                  - bedrock:GetInferenceProfile
                Resource: !Ref BedrockModelArns
              - Effect: Allow
                Action:
                  - bedrock:ListInferenceProfiles
                Resource: "*"
      Tags:
        - { Key: ManagedBy, Value: bumptriage }

  ReviewAccessKey:
    Type: AWS::IAM::AccessKey
    Properties:
      UserName: !Ref ReviewUser

Outputs:
  AccessKeyId:
    Description: Store as the AWS_ACCESS_KEY_ID repository secret.
    Value: !Ref ReviewAccessKey

  SecretAccessKey:
    Description: >-
      Store as the AWS_SECRET_ACCESS_KEY repository secret. This value is
      readable by anyone who can view the stack's outputs; rotate it if that set
      of people is wider than you intend.
    Value: !GetAtt ReviewAccessKey.SecretAccessKey
