name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Installs exactly what the lockfile records, and fails if package.json
      # and the lockfile have drifted apart.
      - run: npm ci --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Builds from source rather than pulling the published image, so a change
      # to the Dockerfile is exercised on every pull request.
      - name: Build action image
        run: docker build -t bumptriage:ci .

      - name: Action fails closed without configuration
        run: |
          if docker run --rm bumptriage:ci; then
            echo "Expected a non-zero exit with no configuration supplied." >&2
            exit 1
          fi
