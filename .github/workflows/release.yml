# Builds, publishes, and attests the action image, then opens a pull request
# pinning action.yml to the resulting digest.
#
# Why this shape:
#   - A container action declared as `image: Dockerfile` is REBUILT on the
#     runner at the start of every consuming job. Publishing an image turns that
#     into one cached pull.
#   - The pin is a digest, not a tag. A tag is mutable by anyone who can push to
#     the registry; a digest is content-addressed. A consumer pinning
#     `uses: zchryr/bumptriage@v1` therefore transitively gets exactly the image
#     that release was built from.
#   - Provenance and SBOM attestations are signed here so that consumers can
#     establish where the image came from. Note what this does and does not buy:
#     it proves which workflow, repository, and commit produced the image. It
#     does not prove the image is safe. See SECURITY.md.
#
# Release process is documented in CONTRIBUTING.md.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without a leading v (for example 0.2.0).
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Both are required to mint a signed attestation.
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Never publish an image built from a tree that fails its own checks.
      - run: npm ci --no-audit --no-fund
      - run: npm test

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          # The agent runtime ships a per-architecture native binary, so each
          # platform is a real build rather than a manifest alias.
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:${{ inputs.version }}
            ghcr.io/${{ github.repository }}:latest
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Summary
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"
            echo '```'
            echo
            echo "Verify with:"
            echo '```bash'
            echo "gh attestation verify \\"
            echo "  oci://ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }} \\"
            echo "  --repo ${{ github.repository }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  pin:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pin action.yml to the published digest
        run: |
          node scripts/pin-image.mjs \
            "docker://${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}"

      - name: Open the release pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          branch="release/v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "release: v${VERSION}"
          git push -u origin "$branch"
          gh pr create \
            --title "release: v${VERSION}" \
            --body "$(cat <<EOF
          Pins \`action.yml\` to the image published for v${VERSION}.

          \`\`\`
          ${{ needs.publish.outputs.image }}@${DIGEST}
          \`\`\`

          Verify before merging:

          \`\`\`bash
          gh attestation verify oci://${{ needs.publish.outputs.image }}@${DIGEST} --repo ${{ github.repository }}
          \`\`\`

          After merging, tag the merge commit \`v${VERSION}\` and move the \`v\${VERSION%%.*}\` tag.
          EOF
          )"
