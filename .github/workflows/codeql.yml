name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so newly published queries reach existing code rather than only
    # code that happens to change.
    - cron: "27 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # `actions` covers the workflows themselves, which matter here: this
        # repository ships workflows other people install.
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@d1ba80a13dd99fba24a470575428917156a28b43 # v3
        with:
          language: ${{ matrix.language }}
          queries: security-extended

      - uses: github/codeql-action/analyze@d1ba80a13dd99fba24a470575428917156a28b43 # v3
        with:
          category: /language:${{ matrix.language }}
