# Privileged half of bumptriage reviewing its own Dependabot pull requests.
#
# Runs on workflow_run, so it never executes pull request code. It downloads the
# transcripts the untrusted job produced, reads the repository, and posts one
# comment. The credentials live here; the execution happened over there.
#
# workflow_run runs from the default branch with the base repository's full
# secrets, so everything it trusts has to be pinned to something the triggering
# pull request cannot choose. See the notes on the job condition and on
# resolving the pull request number.
#
# This is the dogfooding copy. Consumers install the version in examples/, which
# refers to a release tag instead of the working tree.

name: bumptriage dependabot review

on:
  workflow_run:
    workflows: ["bumptriage dependabot validate"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  # Reading artifacts belonging to a different workflow run needs this. Without
  # it the download below fails with a 403.
  actions: read

jobs:
  review:
    # head_repository is set by the forge, not by the pull request author, so a
    # fork cannot satisfy it. Without this a stranger opening a fork pull request
    # from a `dependabot/` branch reaches this job — and its secrets.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    # Holds the model credential behind a required reviewer, so no run can spend
    # money until a human approves it. Restricted to the main branch.
    environment: model-access
    steps:
      # Checkout runs first on purpose: it cleans the workspace, so downloading
      # the transcripts before this point would delete them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download validation transcripts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bumptriage-validation
          path: bumptriage-validation
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The number comes from the workflow_run event, which the forge populates.
      # Taking it from the artifact instead would let whoever produced the
      # artifact name any pull request they liked — including a real bot one,
      # which would pass the action's authorization gate while the evidence
      # bundle stayed under their control. The artifact's copy is compared
      # against it purely as a tamper signal.
      - name: Resolve pull request number
        id: pr
        env:
          EVENT_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          case "$EVENT_NUMBER" in
            ''|*[!0-9]*)
              echo "Refusing to continue: the workflow_run event carried no pull request number." >&2
              exit 1 ;;
          esac
          artifact_number="$(jq -r '.number' bumptriage-validation/pull-request.json)"
          if [ "$artifact_number" != "$EVENT_NUMBER" ]; then
            echo "Refusing to continue: artifact reports PR $artifact_number, event reports $EVENT_NUMBER." >&2
            exit 1
          fi
          echo "number=$EVENT_NUMBER" >> "$GITHUB_OUTPUT"

      # Unauthenticated, which works because this repository is public.
      - name: Fetch pull request commits
        run: git fetch origin "pull/${{ steps.pr.outputs.number }}/head:bumptriage-head"

      - uses: ./
        with:
          provider: anthropic
          base-url: https://api.anthropic.com
          model: ${{ vars.BUMPTRIAGE_MODEL }}
          api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          pr-number: ${{ steps.pr.outputs.number }}
          bots: dependabot
          trusted-authors: dependabot[bot]
          # Pins trust to GitHub's Dependabot app rather than to a name.
          trusted-author-ids: "49699333"
          validation-results: bumptriage-validation/validations.json
