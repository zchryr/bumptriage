# Publishes the CloudFormation templates so the README's Launch Stack links
# resolve.
#
# CloudFormation only fetches a template from an Amazon S3 URL — it validates the
# host before fetching and does not follow redirects — so the templates have to
# live in a real S3 bucket. That bucket is a trust anchor: anyone clicking a
# Launch Stack link creates an IAM role from whatever it serves. Keep it to
# public read on objects only, with no listing and no public write.

name: Publish templates

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate templates
        run: |
          for template in iam/*.yaml; do
            echo "Checking $template"
            python3 -c "import sys,yaml; yaml.SafeLoader.add_multi_constructor('!', lambda l,s,n: None); yaml.safe_load(open(sys.argv[1]))" "$template"
          done

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.RELEASE_ROLE_ARN }}
          aws-region: ${{ vars.RELEASE_AWS_REGION }}
          role-session-name: bumptriage-templates

      - name: Publish templates to S3
        env:
          BUCKET: ${{ vars.TEMPLATE_BUCKET }}
          VERSION: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          # Versioned copies are immutable; `latest` is what the README links to.
          aws s3 sync iam/ "s3://${BUCKET}/${VERSION}/" --exclude '*' --include '*.yaml'
          aws s3 sync iam/ "s3://${BUCKET}/latest/" --exclude '*' --include '*.yaml'
