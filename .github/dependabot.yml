version: 2

updates:
  # Workflows here pin third-party actions by commit SHA, which is the point:
  # a tag can be moved by whoever controls the action's repository. Pinning
  # trades that risk for staleness, and this is what pays the staleness back.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(actions)"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm:
        patterns: ["*"]
        # The agent SDK is the one dependency whose update genuinely changes
        # behaviour, so it is reviewed on its own rather than inside a batch.
        exclude-patterns: ["@anthropic-ai/*"]

  # Base images in the Dockerfile are pinned by digest for the same reason as
  # the actions above.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(docker)"
