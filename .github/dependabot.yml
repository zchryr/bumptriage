version: 2

updates:
  # Workflows here pin third-party actions by commit SHA, which is the point:
  # a tag can be moved by whoever controls the action's repository. Pinning
  # trades that risk for staleness, and this is what pays the staleness back.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(actions)"

  # npm is deliberately absent: Renovate manages it, per renovate.json. Both
  # bots watching the same ecosystem would open duplicate pull requests, and
  # each duplicate costs a bumptriage review. Splitting by ecosystem also keeps
  # both bot profiles exercised against the real action.

  # Base images in the Dockerfile are pinned by digest for the same reason as
  # the actions above.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(docker)"
